# Fuentes vigiladas por el bot.
# Cada fuente empieza con "- id:". La sangría es de 2 espacios, sin tabuladores.
#
# tipo:          oficial | distribuidor | medio | tienda | comunidad
# peso_inicial:  de 0 a 100. Sube o baja con el tiempo según acierte la fuente.
# metodo:        rss (un feed) | html (leer la página) | tienda (vigilar el estado de una ficha)
# activa:        false hasta que hayas comprobado la url a mano en el navegador.

fuentes:

  # ---------- OFICIALES (confirmadas por búsqueda, falta verificar la url exacta) ----------
  - id: naruto_oficial_noticias
    nombre: "Web oficial de Naruto, sección de noticias"
    tipo: oficial
    peso_inicial: 95
    pais: "JP/Global"
    idioma: en
    metodo: html
    url: "VERIFICAR"   # el dominio es naruto-official.com, sección /en/news/
    activa: false

  - id: web_oficial_juego
